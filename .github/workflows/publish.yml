name: Publish Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/*/package.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm nx run-many -t build --projects=tag:publishable --skipRemoteCache --skipNxCache

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        run: |
          # Dependencies must reach npm before the packages that depend on them,
          # otherwise a dependent lands referencing versions that do not exist yet.
          publishable_packages=$(node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const packagesDir = path.join(process.cwd(), 'packages');
          const internalPackages = new Set(['@analog-tools/auth-angular']);

          const manifests = fs
            .readdirSync(packagesDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => path.join(packagesDir, entry.name, 'package.json'))
            .filter((filePath) => fs.existsSync(filePath))
            .map((filePath) => JSON.parse(fs.readFileSync(filePath, 'utf8')))
            .filter((manifest) => Boolean(manifest.name));

          const workspaceNames = new Set(manifests.map((m) => m.name));

          // Edges point from a package to the workspace packages it needs first.
          const dependencies = new Map(
            manifests.map((manifest) => [
              manifest.name,
              new Set(
                [
                  'dependencies',
                  'peerDependencies',
                  'optionalDependencies',
                ].flatMap((section) => Object.keys(manifest[section] ?? {}))
                  .filter((name) => workspaceNames.has(name))
              ),
            ])
          );

          // Kahn's algorithm, alphabetical tie-break so the order is stable
          // regardless of how the filesystem returns directory entries.
          const ordered = [];
          const remaining = new Set(workspaceNames);

          while (remaining.size > 0) {
            const ready = [...remaining]
              .filter((name) =>
                [...dependencies.get(name)].every((dep) => !remaining.has(dep))
              )
              .sort();

            if (ready.length === 0) {
              console.error(
                `Cycle among workspace packages: ${[...remaining].sort().join(', ')}`
              );
              process.exit(1);
            }

            for (const name of ready) {
              ordered.push(name);
              remaining.delete(name);
            }
          }

          console.log(
            ordered.filter((name) => !internalPackages.has(name)).join(' ')
          );
          NODE
          )

          if [[ -z "$publishable_packages" ]]; then
            echo "No publishable packages found under packages/."
            exit 1
          fi

          echo "Publish order: $publishable_packages"

          for package_name in $publishable_packages; do
            build_dir="node_modules/$package_name"

            if [ ! -f "$build_dir/package.json" ]; then
              echo "Expected build output missing for $package_name at $build_dir"
              exit 1
            fi

            version=$(node -p "require('./$build_dir/package.json').version")

            # Republishing an existing version is a hard npm error. Skipping lets
            # a partially completed release be finished by re-running this job.
            if npm view "$package_name@$version" version >/dev/null 2>&1; then
              echo "Skipping $package_name@$version - already on npm"
              continue
            fi

            echo "Publishing $package_name@$version from $build_dir"
            (cd "$build_dir" && pnpm publish --provenance --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
