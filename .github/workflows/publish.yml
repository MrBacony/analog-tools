name: Publish Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/*/package.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm nx run-many -t build --projects=tag:publishable --skipRemoteCache --skipNxCache

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        run: |
          publishable_packages=$(node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const packagesDir = path.join(process.cwd(), 'packages');
          const internalPackages = new Set(['@analog-tools/auth-angular']);

          const packageNames = fs
            .readdirSync(packagesDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => path.join(packagesDir, entry.name, 'package.json'))
            .filter((filePath) => fs.existsSync(filePath))
            .map((filePath) => JSON.parse(fs.readFileSync(filePath, 'utf8')).name)
            .filter((name) => Boolean(name) && !internalPackages.has(name));

          console.log(packageNames.join(' '));
          NODE
          )

          if [[ -z "$publishable_packages" ]]; then
            echo "No publishable packages found under packages/."
            exit 1
          fi

          for package_name in $publishable_packages; do
            build_dir="node_modules/$package_name"
            if [ -f "$build_dir/package.json" ]; then
              echo "Publishing $build_dir"
              (cd "$build_dir" && pnpm publish --provenance --access public)
            else
              echo "Expected build output missing for $package_name at $build_dir"
              exit 1
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
