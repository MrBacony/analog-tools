name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Without an explicit base, `nx affected` compares against main, which
      # on a push to main is HEAD itself and selects no projects at all.
      - name: Derive base and head for nx affected
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: Run Nx tests
        run: pnpm nx affected --target=test --parallel=3 --skipRemoteCache --skipNxCache

      - name: Build packages
        run: pnpm nx affected --target=build --parallel=3 --skipRemoteCache --skipNxCache

      - name: Build example app
        run: pnpm nx build analog-example --skipNxCache --skipRemoteCache

        # NEW: Add this step at the end of your job
      - name: Fix CI
        run: pnpm nx fix-ci
        if: always() # IMPORTANT: Always run
